name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # One step: `npm run check` is the exact sequence a developer runs locally.
      - run: npm run check

  docker:
    # The hosted MCP server's image must build from a clean checkout and come up healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f mcp/Dockerfile -t technogym-mcp .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name mcp -p 3000:3000 \
            -e PUBLIC_URL=http://localhost:3000 -e SEAL_KEYS="$(openssl rand -base64 32)" -e DB_PATH=/data/grants.db \
            technogym-mcp
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/mcp/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1

# CI never calls mywellness: it has no credentials.
